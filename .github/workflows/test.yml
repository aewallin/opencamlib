name: Test

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop
    tags:
      - v*
  workflow_dispatch:

jobs:
  cxx:
    name: ${{ matrix.os_short }} c++${{ matrix.os == 'macos-15-intel' && ' x86_64' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022", "macos-15", "macos-15-intel", "ubuntu-24.04"]
        include:
          - os: "windows-2022"
            os_short: "windows"
          - os: "macos-15"
            os_short: "macos"
          - os: "macos-15-intel"
            os_short: "macos"
          - os: "ubuntu-24.04"
            os_short: "linux"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install
        shell: bash
        run: |
          if [ "${{ matrix.os_short }}" == "linux" ]; then
            export OCL_SUDO_INSTALL="1"
          fi
          if [ "${{ matrix.os_short }}" == "macos" ]; then
            export OCL_SUDO_INSTALL="1"
            export OCL_MACOS_ARCHITECTURE="$(uname -m)"
          fi
          ./install.sh \
            --install-ci-deps \
            --build-library cxx \
            --build-type release \
            --install \
            --test
  nodejs:
    name: ${{ matrix.os_short }} node.js${{ matrix.os == 'macos-15-intel' && ' x86_64' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022", "macos-15", "macos-15-intel", "ubuntu-24.04"]
        include:
          - os: "windows-2022"
            os_short: "windows"
          - os: "macos-15"
            os_short: "macos"
          - os: "macos-15-intel"
            os_short: "macos"
          - os: "ubuntu-24.04"
            os_short: "linux"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install
        shell: bash
        run: |
          if [ "${{ matrix.os_short }}" == "linux" ]; then
            export OCL_SUDO_INSTALL="1"
          fi
          if [ "${{ matrix.os_short }}" == "macos" ]; then
            export OCL_MACOS_ARCHITECTURE="$(uname -m)"
          fi
          ./install.sh \
            --install-ci-deps \
            --build-library nodejs \
            --build-type release \
            --node-architecture $(node -p "require('os').arch()") \
            --install \
            --test
  python:
    name: ${{ matrix.os_short }} python${{ matrix.os == 'macos-15-intel' && ' x86_64' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022", "macos-15", "macos-15-intel", "ubuntu-24.04"]
        include:
          - os: "windows-2022"
            os_short: "windows"
          - os: "macos-15-intel"
            os_short: "macos"
            cmake_generator: "Unix Makefiles"
          - os: "macos-15"
            os_short: "macos"
            cmake_generator: "Unix Makefiles"
          - os: "ubuntu-24.04"
            os_short: "linux"
            cmake_generator: "Unix Makefiles"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        shell: bash
        run: |
          ./install.sh \
            --build-library python \
            --build-type release \
            --install-system-deps \
            --python-executable python \
            --python-pip-install \
            --test
        env:
          CMAKE_GENERATOR: ${{ matrix.cmake_generator }}
